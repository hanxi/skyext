name: CI & Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    container: debian:13

    services:
      mongo:
        image: mongo:6-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -qx 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.5
        env:
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
        ports:
          - 2379:2379

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential make pkg-config autoconf automake libtool \
          git curl ca-certificates unzip \
          libreadline-dev libedit-dev libssl-dev \
          lcov

    - name: Update CA certificates
      run: |
        update-ca-certificates
        git config --global http.sslverify true
        git config --global http.sslcainfo /etc/ssl/certs/ca-certificates.crt

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install StyLua (schema generation)
      run: |
        curl -fLsS -o /tmp/stylua.zip \
          https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
        echo 'bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab  /tmp/stylua.zip' | sha256sum -c -
        unzip -q /tmp/stylua.zip -d /usr/local/bin
        stylua --version

    - name: Build and generate example schema
      run: |
        make build C_COVERAGE=1
        test -s example/build/lualib/game/orm/schema.lua
        ./bin/skyext generate proto
        test -s example/build/proto/sproto.spb

    - name: Check ORM schema compatibility
      run: ./bin/skyext schema check

    - name: Verify game package contains generated schema
      run: |
        ./bin/skyext package game
        unzip -Z1 example/skyext.zip | grep -Fx 'example/build/lualib/game/orm/schema.lua'
        unzip -Z1 example/skyext.zip | grep -Fx 'lualib/orm/init.lua'
        if unzip -Z1 example/skyext.zip | grep -E '\.test\.lua$|^example/etc/\.skytest_'; then
          echo 'Game package contains test sources or a temporary test config' >&2
          exit 1
        fi

    - name: Wait for services
      shell: bash
      run: |
        set -euo pipefail
        mongo_ready=false
        for i in $(seq 1 30); do
          if (echo > /dev/tcp/mongo/27017) 2>/dev/null; then
            mongo_ready=true
            break
          fi
          sleep 1
        done
        test "$mongo_ready" = true
        etcd_ready=false
        for i in $(seq 1 30); do
          if curl -fsS http://etcd:2379/health | grep -Eq '"health"[[:space:]]*:[[:space:]]*"true"'; then
            etcd_ready=true
            break
          fi
          sleep 1
        done
        test "$etcd_ready" = true

    - name: Run tests with coverage and MongoDB/etcd integration
      env:
        SKYTEST_INTEGRATION: '1'
        MONGO_HOST: mongo
        ETCD_ENDPOINTS: http://etcd:2379
      run: ./bin/skyext test --cov --cov-c

    - name: Enforce minimum line coverage
      run: |
        ./bin/skyext cov check coverage/lua_coverage_clean.info --threshold 85
        ./bin/skyext cov check coverage/c_coverage.info --threshold 60

    - name: Summarize coverage
      run: |
        echo '### Lua' >> "$GITHUB_STEP_SUMMARY"
        ./bin/skyext cov summary coverage/lua_coverage_clean.info >> "$GITHUB_STEP_SUMMARY"
        echo '### C（引擎源码）' >> "$GITHUB_STEP_SUMMARY"
        ./bin/skyext cov summary coverage/c_coverage.info >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/html/
        retention-days: 30

    - name: Upload lcov
      uses: actions/upload-artifact@v7
      with:
        name: coverage-lcov
        path: coverage/lua_coverage_clean.info
        retention-days: 30

    - name: Upload C coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-c-report
        path: coverage/html-c/
        retention-days: 30

    - name: Upload C lcov
      uses: actions/upload-artifact@v7
      with:
        name: coverage-c-lcov
        path: coverage/c_coverage.info
        retention-days: 30

    - name: Install Bun (TypeScript SDK)
      run: |
        curl -fsSL https://bun.sh/install | bash
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

    - name: TypeScript SDK typecheck & unit tests
      run: |
        cd sdk/ts
        bun install --frozen-lockfile
        bunx tsc --noEmit
        bun test

    - name: Start example servers for TypeScript SDK E2E
      # 容器 job 不声明 shell 时用 sh（dash）：/dev/tcp 探测永远失败、
      # ${var//x/y} 直接 Bad substitution。必须显式 bash
      shell: bash
      run: |
        # 示例配置写死 127.0.0.1；容器 job 里 mongo/etcd 服务容器只能按服务名访问
        sed -i -e 's/^\( *\)host = "127.0.0.1",/\1host = "mongo",/' \
               -e 's|"http://127.0.0.1:2379"|"http://etcd:2379"|' \
               -e '/"http:\/\/127.0.0.1:237[78]",/d' \
               example/etc/nodes/common.app.lua
        # 三条断言守住上面的 sed：示例配置改了导致 sed 落空时，在这里立刻失败，
        # 而不是等下面的就绪探测超时后再猜原因
        test "$(grep -c 'host = "mongo",' example/etc/nodes/common.app.lua)" = 3
        grep -q '"http://etcd:2379",' example/etc/nodes/common.app.lua
        grep -q 'metrics_http_host = "127.0.0.1"' example/etc/nodes/common.app.lua
        # 文件日志桶启动即 assert(io.open("logs/*.log"))，全新检出没有 logs/
        mkdir -p logs
        nohup ./bin/skyext serve account1 > /tmp/account1.out 2>&1 &
        echo $! > /tmp/account1.pid
        nohup ./bin/skyext serve role1 > /tmp/role1.out 2>&1 &
        echo $! > /tmp/role1.pid
        # 覆盖率插桩构建 + 2 核 runner 启动偏慢，探测窗口给足 90 秒
        account_ready=false
        for i in $(seq 1 90); do
          if curl -fsS http://127.0.0.1:8080/servers > /dev/null 2>&1; then
            account_ready=true
            echo "account ready after ${i}s"
            break
          fi
          sleep 1
        done
        gate_ready=false
        for i in $(seq 1 90); do
          if (echo > /dev/tcp/127.0.0.1/7013) 2>/dev/null; then
            gate_ready=true
            echo "gate ready after ${i}s"
            break
          fi
          sleep 1
        done
        if [ "$account_ready" != true ] || [ "$gate_ready" != true ]; then
          echo 'example servers failed to start' >&2
          tail -n 100 /tmp/account1.out /tmp/role1.out >&2 || true
          # 网页日志需要登录才能看；把关键错误发成 annotation，公开 API 即可读到。
          # 去掉 ANSI 色码和 %（annotation 转义太繁琐，删掉足够）。
          # shell: bash 自带 -eo pipefail：grep 无匹配退出 1 会中止脚本，|| true 兜底
          echo "::error title=readiness::account_ready=$account_ready gate_ready=$gate_ready"
          for f in /tmp/account1.out /tmp/role1.out; do
            sed -e 's/\x1b\[[0-9;]*m//g' "$f" 2>/dev/null \
              | grep -E ' E\]| F\]|assert|traceback|bootfail' \
              | tail -n 12 \
              | tr -d '%' \
              | while IFS= read -r line; do
                  printf '::error title=%s::%s\n' "$(basename "$f")" "$line"
                done || true
          done
          exit 1
        fi

    - name: TypeScript SDK E2E (real servers)
      env:
        SKYEXT_E2E: '1'
      run: |
        cd sdk/ts
        bun test test/e2e

    - name: Stop example servers
      if: always()
      run: |
        # pid 文件里是 bin/skyext 包装进程；skynet 是它的子进程，kill 包装不会带走子进程
        kill $(cat /tmp/account1.pid /tmp/role1.pid) 2>/dev/null || true
        pkill -f 'skyext.lua serve' 2>/dev/null || true
        pkill -f 'bin/skynet ' 2>/dev/null || true

  deploy-pages:
    name: Deploy Pages (when configured)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - name: Check Pages configuration
      id: pages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        status=$(curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Accept: application/vnd.github+json' \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
        case "$status" in
          200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
          404) echo "GitHub Pages 尚未启用；覆盖率报告已作为构建产物上传，本次跳过站点部署。" >> "$GITHUB_STEP_SUMMARY" ;;
          *) echo "查询 GitHub Pages 失败 (HTTP $status)" >&2; exit 1 ;;
        esac

    - name: Checkout code
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/checkout@v6

    - name: Download coverage report
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/download-artifact@v8
      with:
        name: coverage-report
        path: _site/coverage

    - name: Download C coverage report
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/download-artifact@v8
      with:
        name: coverage-c-report
        path: _site/coverage-c

    - name: Assemble site
      if: steps.pages.outputs.enabled == 'true'
      run: |
        mkdir -p _site
        printf '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=docs/">' > _site/index.html
        touch _site/.nojekyll

        # Docsify doc site at /docs/
        mkdir -p _site/docs
        rsync -a --exclude='plan/' --exclude='design/' --exclude='archive/' --exclude='internal/' docs/ _site/docs/

    - name: Setup Pages
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/configure-pages@v6

    - name: Upload to Pages
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

    - name: Deploy
      if: steps.pages.outputs.enabled == 'true'
      id: deploy
      uses: actions/deploy-pages@v5
