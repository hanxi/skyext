name: CI & Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    container: debian:13

    services:
      mongo:
        image: mongo:6-jammy
        ports:
          - 27017:27017
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.5
        env:
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
        ports:
          - 2379:2379

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential make pkg-config autoconf automake libtool \
          git curl ca-certificates \
          libreadline-dev libedit-dev libssl-dev \
          lcov

    - name: Update CA certificates
      run: |
        update-ca-certificates
        git config --global http.sslverify true
        git config --global http.sslcainfo /etc/ssl/certs/ca-certificates.crt

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Build
      run: make build

    - name: Wait for services
      run: |
        for i in $(seq 1 30); do
          (echo > /dev/tcp/mongo/27017) 2>/dev/null && break
          sleep 1
        done
        for i in $(seq 1 30); do
          curl -sf http://etcd:2379/health >/dev/null 2>&1 && break || true
          sleep 1
        done

    - name: Run tests with coverage
      env:
        MONGO_HOST: mongo
        ETCD_ENDPOINTS: http://etcd:2379
      run: ./bin/lua scripts/skyext.lua test --cov

    - name: Summarize coverage
      run: ./bin/lua scripts/skyext.lua cov summary coverage/lua_coverage_clean.info >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/html/
        retention-days: 30

    - name: Upload lcov
      uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: coverage/lua_coverage_clean.info
        retention-days: 30

  deploy-pages:
    name: Deploy Pages (when configured)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - name: Check Pages configuration
      id: pages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        status=$(curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Accept: application/vnd.github+json' \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
        case "$status" in
          200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
          404) echo "GitHub Pages 尚未启用；覆盖率报告已作为构建产物上传，本次跳过站点部署。" >> "$GITHUB_STEP_SUMMARY" ;;
          *) echo "查询 GitHub Pages 失败 (HTTP $status)" >&2; exit 1 ;;
        esac

    - name: Checkout code
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/checkout@v6

    - name: Download coverage report
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/download-artifact@v4
      with:
        name: coverage-report
        path: _site/coverage

    - name: Assemble site
      if: steps.pages.outputs.enabled == 'true'
      run: |
        mkdir -p _site
        printf '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=docs/">' > _site/index.html
        touch _site/.nojekyll

        # Docsify doc site at /docs/
        mkdir -p _site/docs
        rsync -a --exclude='plan/' --exclude='design/' --exclude='internal/' docs/ _site/docs/

    - name: Setup Pages
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/configure-pages@v5

    - name: Upload to Pages
      if: steps.pages.outputs.enabled == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Deploy
      if: steps.pages.outputs.enabled == 'true'
      id: deploy
      uses: actions/deploy-pages@v4
