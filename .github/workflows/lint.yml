name: Lua Lint and Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lua Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Setup Lua
      uses: leafo/gh-actions-lua@v11
      with:
        luaVersion: "5.4"

    # 裸名 require 和节点目录重名都不会报错，只会悄悄加载到别的文件
    - name: Search path check
      run: lua scripts/ci/check_paths.lua .

    - name: Luacheck linter
      uses: lunarmodules/luacheck@v1

    - name: StyLua format check
      uses: JohnnyMorganz/stylua-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        version: 2.5.2
        args: --check .
