name: Build and Release Skyext

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macosx
            os: macos-latest
          - platform: windows
            os: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config autoconf automake libtool \
          libssl-dev libreadline-dev libedit-dev rsync zip

    - name: Install dependencies (macOS)
      if: matrix.platform == 'macosx'
      run: brew install autoconf automake libtool openssl@3 rsync

    - name: Install dependencies (Windows)
      if: matrix.platform == 'windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make git rsync zip
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-binutils
          mingw-w64-x86_64-openssl

    - name: Build Linux
      if: matrix.platform == 'linux'
      run: make -C example linux

    - name: Build macOS
      if: matrix.platform == 'macosx'
      run: |
        openssl_prefix="$(brew --prefix openssl@3)"
        make -C example macosx \
          MYCFLAGS="-I${openssl_prefix}/include -L${openssl_prefix}/lib" \
          TLS_INC="${openssl_prefix}/include" TLS_LIB="${openssl_prefix}/lib"

    - name: Build Windows
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        test "$(gcc -dumpmachine)" = x86_64-w64-mingw32
        make -C example mingw CC=gcc AR=ar RANLIB=ranlib
        # Bundle all MinGW DLLs imported by the executables and C modules,
        # including transitive OpenSSL dependencies.
        while :; do
          copied=0
          for binary in bin/*.exe bin/*.dll luaclib/*.so luaclib/skytest/*.so \
                        cservice/*.so skynet/luaclib/*.so skynet/cservice/*.so; do
            [ -f "$binary" ] || continue
            for name in $(objdump -p "$binary" | awk '/DLL Name:/ { print $3 }'); do
              dll="/mingw64/bin/$name"
              if [ -f "$dll" ] && [ ! -f "bin/$name" ]; then
                cp "$dll" bin/
                copied=1
              fi
            done
          done
          [ "$copied" -eq 0 ] && break
        done
        test -f skynet/luaclib/ltls.so
        env PATH="$(pwd)/bin:/usr/bin:/bin" ./bin/lua.exe -e \
          'package.cpath = "./luaclib/?.so;./skynet/luaclib/?.so"; assert(require("crypto")); assert(package.loadlib("./skynet/luaclib/ltls.so", "luaopen_ltls_init_c"))'

    - name: Package Linux/macOS
      if: matrix.platform != 'windows'
      run: sh scripts/ci/package-release.sh "${{ matrix.platform }}"

    - name: Package Windows
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: sh scripts/ci/package-release.sh windows

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: skyext-${{ matrix.platform }}
        path: release-assets/skyext-${{ matrix.platform }}.zip
        if-no-files-found: error
        retention-days: 30

  build-freebsd:
    name: Build freebsd
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Build and package in FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        release: '14.4'
        sync: rsync
        prepare: |
          pkg install -y gmake git autoconf automake libtool pkgconf openssl rsync zip
        run: |
          set -eu
          test "$(uname -s)" = FreeBSD
          gmake -C example freebsd \
            MYCFLAGS='-I/usr/local/include -L/usr/local/lib' \
            TLS_INC=/usr/local/include TLS_LIB=/usr/local/lib
          sh scripts/ci/package-release.sh freebsd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: skyext-freebsd
        path: release-assets/skyext-freebsd.zip
        if-no-files-found: error
        retention-days: 30

  release:
    name: Create Release
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: skyext-*
        path: release-assets
        merge-multiple: true

    - name: Verify release assets
      run: |
        for platform in linux macosx windows freebsd; do
          test -s "release-assets/skyext-${platform}.zip"
          unzip -tq "release-assets/skyext-${platform}.zip" > /dev/null
        done
        ls -lh release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
