name: Build and Release Skyext

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macosx
            os: macos-latest
          - platform: windows
            os: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Install dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config autoconf automake libtool \
          libssl-dev libreadline-dev libedit-dev rsync zip unzip

    - name: Install dependencies (macOS)
      if: matrix.platform == 'macosx'
      run: brew install autoconf automake libtool openssl@3 rsync

    - name: Install dependencies (Windows)
      if: matrix.platform == 'windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make git rsync zip
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-binutils
          mingw-w64-x86_64-openssl

    - name: Build Linux
      if: matrix.platform == 'linux'
      run: make -C example linux

    - name: Build macOS
      if: matrix.platform == 'macosx'
      run: |
        openssl_prefix="$(brew --prefix openssl@3)"
        make -C example macosx \
          OPENSSL_CFLAGS="-I${openssl_prefix}/include" \
          OPENSSL_LDFLAGS="-L${openssl_prefix}/lib" \
          TLS_INC="${openssl_prefix}/include" TLS_LIB="${openssl_prefix}/lib"

    - name: Apply Skynet MinGW compatibility patch
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        git -C skynet apply --check ../scripts/ci/patches/skynet-mingw-clock.patch
        git -C skynet apply ../scripts/ci/patches/skynet-mingw-clock.patch

    - name: Build Windows
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        test "$(gcc -dumpmachine)" = x86_64-w64-mingw32
        make -C example mingw CC=gcc AR=ar RANLIB=ranlib
        # Bundle all MinGW DLLs imported by the executables and C modules,
        # including transitive OpenSSL dependencies.
        while :; do
          copied=0
          for binary in bin/*.exe bin/*.dll luaclib/*.so luaclib/skytest/*.so \
                        cservice/*.so skynet/luaclib/*.so skynet/cservice/*.so; do
            [ -f "$binary" ] || continue
            for name in $(objdump -p "$binary" | awk '/DLL Name:/ { print $3 }'); do
              dll="/mingw64/bin/$name"
              if [ -f "$dll" ] && [ ! -f "bin/$name" ]; then
                cp "$dll" bin/
                copied=1
              fi
            done
          done
          [ "$copied" -eq 0 ] && break
        done
        test -f skynet/luaclib/ltls.so
        env PATH="$(pwd)/bin:/usr/bin:/bin" ./bin/lua.exe -e \
          'package.cpath = "./luaclib/?.so;./skynet/luaclib/?.so"; assert(require("crypto")); assert(package.loadlib("./skynet/luaclib/ltls.so", "luaopen_ltls_init_c"))'

    - name: Smoke test CLI (Linux/macOS)
      if: matrix.platform != 'windows'
      shell: bash
      run: |
        set -euo pipefail
        test -x bin/skyext
        cd "$RUNNER_TEMP"
        cli="$GITHUB_WORKSPACE/bin/skyext"
        "$cli" --help | grep -F '用法: ./bin/skyext'
        "$cli" test --help | grep -F -- '--match TEXT'
        "$cli" generate --help | grep -F 'generate <proto|schema>'
        "$cli" package --help | grep -F 'package framework <platform>'
        "$cli" test --match "no matching tests" "$GITHUB_WORKSPACE/lualib/skyext/errcode.test.lua" | grep -Fx 'No test files found.'
        if "$cli" unknown-command >/dev/null 2>&1; then
          echo 'Unknown command unexpectedly succeeded' >&2
          exit 1
        else
          test "$?" -eq 1
        fi
        PATH="$GITHUB_WORKSPACE/bin:$PATH" skyext --help >/dev/null

    - name: Smoke test CLI (Windows CMD)
      if: matrix.platform == 'windows'
      shell: cmd
      run: |
        @echo off
        set "PATH=%GITHUB_WORKSPACE%\bin;%SystemRoot%\System32;%SystemRoot%"
        cd /d "%TEMP%"
        call "%GITHUB_WORKSPACE%\bin\skyext.bat" --help > "%TEMP%\skyext-cli-help.txt" 2>&1
        if errorlevel 1 (type "%TEMP%\skyext-cli-help.txt" & exit /b 1)
        call "%GITHUB_WORKSPACE%\bin\skyext.bat" generate --help > "%TEMP%\skyext-cli-generate.txt" 2>&1
        if errorlevel 1 (type "%TEMP%\skyext-cli-generate.txt" & exit /b 1)
        call "%GITHUB_WORKSPACE%\bin\skyext.bat" package --help > "%TEMP%\skyext-cli-package.txt" 2>&1
        if errorlevel 1 (type "%TEMP%\skyext-cli-package.txt" & exit /b 1)
        call "%GITHUB_WORKSPACE%\bin\skyext.bat" test --match "no matching tests" "%GITHUB_WORKSPACE%\lualib\skyext\errcode.test.lua" > "%TEMP%\skyext-cli-test.txt" 2>&1
        if errorlevel 1 (type "%TEMP%\skyext-cli-test.txt" & exit /b 1)
        call "%GITHUB_WORKSPACE%\bin\skyext.bat" unknown-command > "%TEMP%\skyext-cli-unknown.txt" 2>&1
        if not "%ERRORLEVEL%"=="1" (type "%TEMP%\skyext-cli-unknown.txt" & exit /b 1)
        exit /b 0

    - name: Verify CLI output (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        $checks = @{
          'skyext-cli-help.txt' = './bin/skyext'
          'skyext-cli-generate.txt' = 'generate <proto|schema>'
          'skyext-cli-package.txt' = 'package framework <platform>'
          'skyext-cli-test.txt' = 'No test files found.'
          'skyext-cli-unknown.txt' = 'unknown-command'
        }
        foreach ($entry in $checks.GetEnumerator()) {
          $output = Get-Content (Join-Path $env:TEMP $entry.Key) -Raw -Encoding utf8
          if (-not $output.Contains($entry.Value)) {
            throw "Expected '$($entry.Value)' in $($entry.Key), got: $output"
          }
        }

    - name: Package Linux/macOS
      if: matrix.platform != 'windows'
      run: ./bin/lua scripts/skyext.lua package framework "${{ matrix.platform }}"

    - name: Package Windows
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: ./bin/lua.exe scripts/skyext.lua package framework windows

    - name: Verify packaged CLI (Linux/macOS)
      if: matrix.platform != 'windows'
      run: |
        archive="release-assets/skyext-${{ matrix.platform }}.zip"
        unzip -Z1 "$archive" | grep -Fx 'bin/skyext'
        unzip -Z1 "$archive" | grep -Fx 'bin/skyext.bat'

    - name: Verify packaged CLI (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        $archive = [System.IO.Compression.ZipFile]::OpenRead('release-assets/skyext-windows.zip')
        try {
          $names = $archive.Entries | ForEach-Object { $_.FullName }
          foreach ($name in 'bin/skyext', 'bin/skyext.bat') {
            if ($name -notin $names) { throw "Missing release entry: $name" }
          }
        } finally {
          $archive.Dispose()
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: skyext-${{ matrix.platform }}
        path: release-assets/skyext-${{ matrix.platform }}.zip
        if-no-files-found: error
        retention-days: 30

  build-freebsd:
    name: Build freebsd
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Build and package in FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        release: '14.4'
        sync: rsync
        prepare: |
          pkg install -y gmake git autoconf automake libtool pkgconf openssl rsync zip unzip
        run: |
          set -eu
          test "$(uname -s)" = FreeBSD
          gmake -C example freebsd \
            OPENSSL_CFLAGS=-I/usr/local/include \
            OPENSSL_LDFLAGS=-L/usr/local/lib \
            TLS_INC=/usr/local/include TLS_LIB=/usr/local/lib
          test -x bin/skyext
          ./bin/skyext --help > /tmp/skyext-cli-help.txt
          grep -F '用法: ./bin/skyext' /tmp/skyext-cli-help.txt
          ./bin/skyext generate --help > /tmp/skyext-cli-generate.txt
          grep -F 'generate <proto|schema>' /tmp/skyext-cli-generate.txt
          ./bin/skyext package --help > /tmp/skyext-cli-package.txt
          grep -F 'package framework <platform>' /tmp/skyext-cli-package.txt
          ./bin/skyext test --match "no matching tests" lualib/skyext/errcode.test.lua > /tmp/skyext-cli-test.txt
          grep -Fx 'No test files found.' /tmp/skyext-cli-test.txt
          if ./bin/skyext unknown-command >/dev/null 2>&1; then
            exit 1
          else
            test "$?" -eq 1
          fi
          ./bin/lua scripts/skyext.lua package framework freebsd
          unzip -Z1 release-assets/skyext-freebsd.zip | grep -Fx 'bin/skyext'
          unzip -Z1 release-assets/skyext-freebsd.zip | grep -Fx 'bin/skyext.bat'

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: skyext-freebsd
        path: release-assets/skyext-freebsd.zip
        if-no-files-found: error
        retention-days: 30

  release:
    name: Create Release
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: skyext-*
        path: release-assets
        merge-multiple: true

    - name: Verify release assets
      run: |
        for platform in linux macosx windows freebsd; do
          test -s "release-assets/skyext-${platform}.zip"
          unzip -tq "release-assets/skyext-${platform}.zip" > /dev/null
        done
        ls -lh release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
