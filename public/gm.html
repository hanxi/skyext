<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM 命令面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* 移动端菜单按钮 */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background-color: #1890ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .menu-toggle:active {
            background-color: #096dd9;
        }

        /* 左侧命令列表区域 */
        .sidebar {
            width: 320px;
            background-color: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .sidebar.mobile-hidden {
            transform: translateX(-100%);
        }

        /* 移动端遮罩层 */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #fafafa;
        }

        .sidebar-header h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            padding-left: 0;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 35px 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #1890ff;
        }

        .search-box::after {
            content: "🔍";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .command-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .command-item {
            padding: 12px;
            margin-bottom: 8px;
            background-color: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .command-item:hover {
            border-color: #1890ff;
            box-shadow: 0 2px 8px rgba(24, 144, 255, 0.15);
        }

        .command-item.active {
            background-color: #e6f7ff;
            border-color: #1890ff;
        }

        .command-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .command-desc {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .command-meta {
            font-size: 11px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        /* 右侧命令执行区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 20px 30px;
            background-color: #fff;
            border-bottom: 1px solid #e0e0e0;
        }

        .content-header h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .content-header p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .welcome-message h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        /* 参数表单 */
        .params-form {
            background-color: #fff;
            padding: 24px;
            border-radius: 4px;
            border: 1px solid #e8e8e8;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .form-desc {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: #1890ff;
        }

        .execute-btn {
            width: 100%;
            max-width: 200px;
            padding: 12px;
            background-color: #1890ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 8px;
        }

        .execute-btn:hover {
            background-color: #40a9ff;
        }

        .execute-btn:active {
            background-color: #096dd9;
        }

        .execute-btn:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }

        /* 结果展示 */
        .result-container {
            background-color: #fff;
            padding: 24px;
            border-radius: 4px;
            border: 1px solid #e8e8e8;
            max-width: 1200px;
        }

        .result-header {
            margin-bottom: 16px;
        }

        .result-status {
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .result-status.success {
            background-color: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }

        .result-status.error {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }

        .result-list {
            margin-top: 16px;
        }

        .result-item {
            margin-bottom: 12px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            overflow: hidden;
        }

        .result-item-header {
            padding: 12px 16px;
            background-color: #fafafa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .result-item-header:hover {
            background-color: #f0f0f0;
        }

        .result-item-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .result-item-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 2px;
        }

        .result-item-status.success {
            background-color: #f6ffed;
            color: #52c41a;
        }

        .result-item-status.error {
            background-color: #fff2f0;
            color: #ff4d4f;
        }

        .result-item-body {
            padding: 16px;
            background-color: #fff;
            border-top: 1px solid #e8e8e8;
            display: none;
        }

        .result-item-body.expanded {
            display: block;
        }

        .result-item-body pre {
            background-color: #f5f5f5;
            color: #333;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
            overflow-x: auto;
            margin: 0;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        /* JSON 语法高亮 - 浅色主题 */
        .json-key {
            color: #c41a16;
        }

        .json-string {
            color: #0b7500;
        }

        .json-number {
            color: #1c00cf;
        }

        .json-boolean {
            color: #aa0d91;
        }

        .json-null {
            color: #aa0d91;
        }

        .toggle-icon {
            transition: transform 0.3s;
        }

        .toggle-icon.expanded {
            transform: rotate(90deg);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 1000;
                transform: translateX(-100%);
            }

            .sidebar:not(.mobile-hidden) {
                transform: translateX(0);
            }

            .sidebar-header {
                padding: 60px 20px 20px 20px;
            }

            .sidebar-header h1 {
                padding-left: 0;
            }

            .main-content {
                width: 100%;
            }

            .content-header {
                padding: 60px 20px 20px 20px;
            }

            .content-body {
                padding: 20px;
            }

            .params-form {
                padding: 16px;
            }

            .result-container {
                padding: 16px;
            }

            .execute-btn {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 移动端菜单按钮 -->
    <button class="menu-toggle" onclick="toggleSidebar()">☰ 菜单</button>

    <!-- 移动端遮罩层 -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="container">
        <!-- 左侧命令列表 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>GM 命令面板</h1>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索命令名称或描述...">
                </div>
            </div>
            <div class="command-list" id="commandList">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <!-- 右侧命令执行区域 -->
        <div class="main-content">
            <div class="content-header" id="contentHeader" style="display: none;">
                <h2 id="commandTitle"></h2>
                <p id="commandDescription"></p>
            </div>
            <div class="content-body" id="contentBody">
                <div class="welcome-message">
                    <h3>👈 请从左侧选择一个命令</h3>
                    <p>选择命令后可以查看参数并执行</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        let allCommands = [];
        let selectedCommand = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadCommands();
            setupSearchListener();
            setupResponsive();
        });

        // 移动端侧边栏切换
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.toggle('mobile-hidden');
            overlay.classList.toggle('active');
        }

        // 响应式处理
        function setupResponsive() {
            // 初始化时根据屏幕大小设置侧边栏状态
            const sidebar = document.querySelector('.sidebar');
            if (window.innerWidth <= 768) {
                sidebar.classList.add('mobile-hidden');
            } else {
                sidebar.classList.remove('mobile-hidden');
            }

            // 监听窗口大小变化
            window.addEventListener('resize', () => {
                const sidebar = document.querySelector('.sidebar');
                const overlay = document.querySelector('.sidebar-overlay');
                
                if (window.innerWidth > 768) {
                    // 桌面端：确保侧边栏显示
                    sidebar.classList.remove('mobile-hidden');
                    overlay.classList.remove('active');
                } else {
                    // 移动端：默认隐藏侧边栏
                    if (!overlay.classList.contains('active')) {
                        sidebar.classList.add('mobile-hidden');
                    }
                }
            });
        }

        // 加载命令列表
        async function loadCommands() {
            try {
                const response = await fetch('/gm/list');
                const data = await response.json();
                
                if (data.code === 0 && data.commands) {
                    allCommands = data.commands;
                    renderCommandList(allCommands);
                } else {
                    showError('加载命令列表失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                showError('网络请求失败: ' + error.message);
            }
        }

        // 渲染命令列表
        function renderCommandList(commands) {
            const listEl = document.getElementById('commandList');
            
            if (commands.length === 0) {
                listEl.innerHTML = '<div class="empty-state">没有找到匹配的命令</div>';
                return;
            }

            listEl.innerHTML = commands.map(cmd => `
                <div class="command-item" data-cmd="${escapeHtml(cmd.cmd)}">
                    <div class="command-name">${escapeHtml(cmd.cmd)}</div>
                    <div class="command-desc">${escapeHtml(cmd.desc || '暂无描述')}</div>
                    <div class="command-meta">服务数: ${cmd.service_count || 0}</div>
                </div>
            `).join('');

            // 绑定点击事件
            listEl.querySelectorAll('.command-item').forEach(item => {
                item.addEventListener('click', () => {
                    const cmdName = item.dataset.cmd;
                    selectCommand(cmdName);
                });
            });
        }

        // 搜索功能
        function setupSearchListener() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase().trim();
                
                if (!keyword) {
                    renderCommandList(allCommands);
                    return;
                }

                const filtered = allCommands.filter(cmd => {
                    const cmdName = (cmd.cmd || '').toLowerCase();
                    const cmdDesc = (cmd.desc || '').toLowerCase();
                    return cmdName.includes(keyword) || cmdDesc.includes(keyword);
                });

                renderCommandList(filtered);
            });
        }

        // 选择命令
        function selectCommand(cmdName) {
            selectedCommand = allCommands.find(cmd => cmd.cmd === cmdName);
            if (!selectedCommand) return;

            // 更新选中状态
            document.querySelectorAll('.command-item').forEach(item => {
                item.classList.toggle('active', item.dataset.cmd === cmdName);
            });

            // 显示命令详情
            showCommandDetail(selectedCommand);

            // 移动端自动关闭侧边栏
            if (window.innerWidth <= 768) {
                toggleSidebar();
            }
        }

        // 显示命令详情
        function showCommandDetail(command) {
            const headerEl = document.getElementById('contentHeader');
            const bodyEl = document.getElementById('contentBody');
            const titleEl = document.getElementById('commandTitle');
            const descEl = document.getElementById('commandDescription');

            // 更新标题和描述
            headerEl.style.display = 'block';
            titleEl.textContent = command.cmd;
            descEl.textContent = command.desc || '暂无描述';

            // 生成参数表单
            const params = command.params || {};
            const hasParams = Object.keys(params).length > 0;

            let formHtml = '<div class="params-form">';
            
            if (hasParams) {
                formHtml += '<form id="paramsForm">';
                for (const [paramName, paramDesc] of Object.entries(params)) {
                    formHtml += `
                        <div class="form-group">
                            <label class="form-label">${escapeHtml(paramName)}</label>
                            <span class="form-desc">${escapeHtml(paramDesc)}</span>
                            <input type="text" class="form-input" name="${escapeHtml(paramName)}" placeholder="请输入${escapeHtml(paramName)}">
                        </div>
                    `;
                }
                formHtml += '</form>';
            } else {
                formHtml += '<p style="color: #999; text-align: center; padding: 20px;">此命令无需参数</p>';
            }

            formHtml += '<button class="execute-btn" onclick="executeCommand()">执行命令</button>';
            formHtml += '</div>';

            formHtml += '<div id="resultContainer"></div>';

            bodyEl.innerHTML = formHtml;
        }

        // 执行命令
        async function executeCommand() {
            if (!selectedCommand) return;

            const btn = document.querySelector('.execute-btn');
            const resultContainer = document.getElementById('resultContainer');
            
            // 禁用按钮
            btn.disabled = true;
            btn.textContent = '执行中...';

            // 收集参数
            const params = { cmd: selectedCommand.cmd };
            const form = document.getElementById('paramsForm');
            if (form) {
                const formData = new FormData(form);
                for (const [key, value] of formData.entries()) {
                    if (value.trim()) {
                        params[key] = value.trim();
                    }
                }
            }

            try {
                const response = await fetch('/gm/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(params)
                });

                const result = await response.json();
                showResult(result);
            } catch (error) {
                showResult({
                    code: 1,
                    error: '网络请求失败: ' + error.message
                });
            } finally {
                btn.disabled = false;
                btn.textContent = '执行命令';
            }
        }

        // 显示执行结果
        function showResult(result) {
            const container = document.getElementById('resultContainer');
            const isSuccess = result.code === 0;

            let html = '<div class="result-container">';
            html += '<div class="result-header">';
            html += `<div class="result-status ${isSuccess ? 'success' : 'error'}">`;
            html += isSuccess ? '✓ 执行成功' : '✗ 执行失败';
            html += '</div>';

            if (!isSuccess && result.error) {
                html += `<div style="color: #ff4d4f; font-size: 14px; padding: 12px; background-color: #fff2f0; border-radius: 4px;">`;
                html += `错误信息: ${escapeHtml(result.error)}`;
                html += '</div>';
            }

            html += '</div>';

            // 显示详细结果
            if (result.results && result.results.length > 0) {
                html += '<div class="result-list">';
                result.results.forEach((item, index) => {
                    const itemSuccess = item.success !== false;
                    html += `
                        <div class="result-item">
                            <div class="result-item-header" onclick="toggleResultItem(${index})">
                                <div class="result-item-title">
                                    <span class="toggle-icon" id="toggle-${index}">▶</span>
                                    服务: ${escapeHtml(item.service || '未知')}
                                </div>
                                <span class="result-item-status ${itemSuccess ? 'success' : 'error'}">
                                    ${itemSuccess ? '成功' : '失败'}
                                </span>
                            </div>
                            <div class="result-item-body" id="result-body-${index}">
                                <pre>${syntaxHighlight(JSON.stringify(item.data || item.error || item, null, 2))}</pre>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // 切换结果项展开/收起
        function toggleResultItem(index) {
            const body = document.getElementById(`result-body-${index}`);
            const icon = document.getElementById(`toggle-${index}`);
            
            if (body && icon) {
                body.classList.toggle('expanded');
                icon.classList.toggle('expanded');
            }
        }

        // 显示错误信息
        function showError(message) {
            const listEl = document.getElementById('commandList');
            listEl.innerHTML = `<div class="empty-state" style="color: #ff4d4f;">${escapeHtml(message)}</div>`;
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // JSON 语法高亮
        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }
    </script>
</body>
</html>
